<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الموقع غير متاح</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 48px 32px;
      max-width: 520px;
    }

    .icon {
      font-size: 72px;
      margin-bottom: 24px;
      display: block;
    }

    .badge {
      display: inline-block;
      background-color: #fff3e0;
      color: #e65c00;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e65c00;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.8;
    }

    .divider {
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #ff8c00, #e65c00);
      border-radius: 2px;
      margin: 24px auto;
    }

    .note {
      background-color: #fff8f3;
      border-right: 4px solid #ff8c00;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 14px;
      color: #777;
      margin-top: 28px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">🛠️</span>
    <div class="badge">تحت التطوير</div>
    <h1>بنعمل تعديلات على الموقع</h1>
    <div class="divider"></div>
    <p>الموقع ده كان مجرد prototype، ودلوقتي بنشتغل على النسخة الحقيقية.</p>
    <div class="note">
      هنرجع قريبا بشكل أحسن بكتير. شكرا لصبرك!
    </div>
  </div>
</body>
</html>
